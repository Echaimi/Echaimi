name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python scripts/fetch_contributions.py
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}

      - run: python scripts/render_heatmap_svg.py

      - run: python scripts/render_contribution_snake.py

      - run: python scripts/render_activity_graph.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg contribution-snake.svg contribution-activity.svg"
